# The build, kit header/footer injection and deploy live in thedylone/style.
name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: thedylone/style/.github/workflows/pages.yml@main
    with:
      site: web/dist
      build: npm ci && npm test && npm run build
      working-directory: web
